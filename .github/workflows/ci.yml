name: CI

on:
  push:
    branches: [main]
  pull_request:

# 同一分支上新的推送取消还在跑的那一次。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Node 24 起类型擦除默认开启，api/ 和 daemon/ 直接跑 .ts，没有构建步骤。
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            api/package-lock.json
            daemon/package-lock.json
            web/package-lock.json
            public/package-lock.json

      - name: 装依赖
        run: npm run install:all

      # 和本地 npm run verify 是同一条命令，两边不会走岔。
      - name: 检查
        run: npm run verify

  # 中文文档过一遍简明技术中文的规则。缺工具时跳过，不要让它变成噪声。
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: 检查禁用词
        run: |
          if grep -rnE '进行[一-龥]{0,4}(处理|部署|操作|检查)|予以|加以|应当|；|——' \
              specs/*.md docs/*.md README.md; then
            echo "上面这些不符合简明技术中文的规则"
            exit 1
          fi
